services:
  postgres:
    image: postgres:16.10-alpine
    container_name: deep-research-postgres
    environment:
      POSTGRES_USER: deep
      POSTGRES_PASSWORD: deep_local_dev_only
      POSTGRES_DB: deep_research
    ports:
      - "55432:5432"
    volumes:
      - deep_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep -d deep_research"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  deep_pgdata:
